services:
  # ===========================================
  # PostgreSQL + pgvector
  # ===========================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: thesisguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesisguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesisguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-thesisguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesisguard} -d ${POSTGRES_DB:-thesisguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: thesisguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===========================================
  # MinIO
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: thesisguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # FastAPI
  # ===========================================
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: thesisguard-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesisguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesisguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-thesisguard}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-thesisguard}:${POSTGRES_PASSWORD:-thesisguard_dev_password}@postgres:5432/${POSTGRES_DB:-thesisguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_QUEUE_URL: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-thesisguard-documents}
      MINIO_SECURE: "false"
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      API_DEBUG: "true"
      API_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./apps:/app/apps
      - ./migrations:/app/migrations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================
  # Dramatiq Worker
  # ===========================================
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: thesisguard-worker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesisguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesisguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-thesisguard}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-thesisguard}:${POSTGRES_PASSWORD:-thesisguard_dev_password}@postgres:5432/${POSTGRES_DB:-thesisguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_QUEUE_URL: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-thesisguard-documents}
      MINIO_SECURE: "false"
      WORKER_CONCURRENCY: 4
      WORKER_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./apps:/app/apps

  # ===========================================
  # Vue Web (Vite dev server)
  # ===========================================
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: thesisguard-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_API_VERSION: ${VITE_API_VERSION:-v1}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-ThesisGuard}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
    name: thesisguard-postgres-data
  redis_data:
    name: thesisguard-redis-data
  minio_data:
    name: thesisguard-minio-data
